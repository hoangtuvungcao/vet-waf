<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Vet-WAF">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d5efc"/>
      <stop offset="0.55" stop-color="#5b8def"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8f6ff"/>
    </linearGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0b1020" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- rounded-square app-icon background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#shine)"/>
  <!-- shield -->
  <g filter="url(#ds)">
    <path d="M256 96 L392 146 V262 C392 344 332 400 256 430 C180 400 120 344 120 262 V146 Z"
          fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.55" stroke-width="10"/>
    <!-- bold V / chevron -->
    <path d="M186 206 L256 330 L326 206"
          fill="none" stroke="url(#vgrad)" stroke-width="42"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- accent dot at apex -->
    <circle cx="256" cy="356" r="15" fill="#a7f3ff"/>
  </g>
</svg>
