#
# Vet-WAF two-node cluster — haproxy front-end with automatic node ejection.
#
# Copyright (C) 2015-2026 Vet-WAF.  GPLv2 — see LICENSE.
#
# Install as /etc/haproxy/haproxy.cfg on BOTH nodes. It is symmetric: each
# node lists itself and its peer, so whichever node receives a request can
# serve it locally or hand it to the other.
#
# ---------------------------------------------------------------------------
# READ THIS BEFORE INSTALLING
# ---------------------------------------------------------------------------
# Vet-WAF binds inside the Linux TCP/IP stack. It and haproxy CANNOT both
# own port 80 on the same host. This file assumes the fronting layout set in
# cluster.env:
#
#     haproxy  :80/:443   (public)
#     Vet-WAF  :8080      (WAF_PORT, loopback + private only)
#
# so in /etc/vet_waf/vet_waf.conf you must change `listen 80;` to
# `listen 8080;` on both nodes, or haproxy will fail to bind.
#
# The cost is real: requests now traverse a user-space proxy before reaching
# the kernel-space WAF, which gives back part of the performance that makes
# Vet-WAF worth running. Take this layout when you want automatic ejection
# more than peak throughput. If you want the throughput, run Vet-WAF directly
# on :80 on both nodes, put both A records in DNS, and use waf-peer-watch.sh
# to pull the record of a failed node instead of haproxy.
# ---------------------------------------------------------------------------

global
    log         /dev/log local0
    log         /dev/log local1 notice
    chroot      /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user        haproxy
    group       haproxy
    daemon
    maxconn     100000

    # Modern TLS only. These apply to the public listener below.
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    mode                    http
    log                     global
    option                  httplog
    option                  dontlognull
    option                  forwardfor
    option                  http-server-close
    retries                 2
    timeout connect         5s
    timeout client          30s
    timeout server          30s
    timeout http-request    10s      # slowloris: bound the header phase
    timeout http-keep-alive 10s
    timeout queue           30s
    timeout check           3s
    maxconn                 50000

# ---------------------------------------------------------------------------
# Public listener
# ---------------------------------------------------------------------------
frontend fe_public
    bind :80
    # Uncomment once certificates exist on BOTH nodes:
    #bind :443 ssl crt /etc/haproxy/certs/firewall.hidev.dev.pem alpn h2,http/1.1
    #http-request redirect scheme https unless { ssl_fc }

    # haproxy is in front of the WAF here, so it sees the real client address
    # and Vet-WAF does not. Pass it on, and strip any inbound copy first so a
    # client cannot forge its own X-Forwarded-For.
    http-request del-header X-Forwarded-For
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Forwarded-Proto %[ssl_fc,iif(https,http)]

    # Cheap L4/L7 flood braking in front of the WAF. Vet-WAF's Frang limits
    # are the real defence; this only keeps haproxy itself from becoming the
    # bottleneck under a volumetric flood.
    stick-table type ip size 1m expire 60s store http_req_rate(10s),conn_cur
    http-request track-sc0 src
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 300 }
    tcp-request connection reject if { src_conn_cur ge 200 }

    default_backend be_waf

# ---------------------------------------------------------------------------
# WAF backend — this node first, peer as failover
# ---------------------------------------------------------------------------
backend be_waf
    balance roundrobin
    option httpchk
    # The health probe must carry a Host header: the Vet-WAF config enables
    # http_strict_host_checking and ends its chain with `-> block`, so a
    # hostless probe is dropped BY DESIGN and would eject a healthy node.
    http-check send meth HEAD uri / hdr Host firewall.hidev.dev
    http-check expect status 200,301,302,404

    # Two independent signals, and a node needs both:
    #   check       — the WAF socket answers correctly
    #   agent-check — waf-health.sh confirms state=start, live origin
    #                 connections, and a real proxied request
    # The agent catches the case the HTTP check cannot: a WAF that answers
    # while its origin link is dead.
    #
    # rise 2 / fall 3: eject after 3 consecutive failures (~6s at inter 2s),
    # readmit only after 2 consecutive successes, so a node flapping under
    # load is not repeatedly handed traffic.
    default-server inter 2s rise 2 fall 3 agent-inter 5s agent-port 8081

    # ---- EDIT THESE TWO LINES PER NODE ----------------------------------
    # On node edge-a (185.113.223.17), `local` is 127.0.0.1 and `peer` is
    # 212.64.215.120. On edge-b, swap the peer address. Keeping the local
    # node on 127.0.0.1 means it is reachable even if the public NIC flaps.
    server local 127.0.0.1:8080 check agent-check agent-addr 127.0.0.1
    server peer  212.64.215.120:8080 check agent-check agent-addr 212.64.215.120 backup
    # ---------------------------------------------------------------------

    # `backup` above means the peer is used ONLY when the local WAF is down.
    # That keeps traffic local and the inter-node link idle in normal
    # operation. Remove `backup` on both nodes for true active-active, but
    # then expect roughly half of all requests to cross between VPSes.

    # If both are down, say so honestly rather than hanging.
    http-request return status 503 content-type "text/plain" \
        string "Vet-WAF: no healthy node\n" if { nbsrv(be_waf) eq 0 }

# ---------------------------------------------------------------------------
# Stats / admin — bound to the private address, peer-only via the firewall
# ---------------------------------------------------------------------------
listen stats
    # Never bind this to 0.0.0.0. waf-firewall.sh additionally restricts the
    # port to the peer address, but the bind is the first line of defence.
    bind 127.0.0.1:8404
    mode http
    stats enable
    stats uri /
    stats refresh 5s
    stats show-node
    stats admin if LOCALHOST
