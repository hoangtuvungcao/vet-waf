##
## Vet-WAF — VPS edge deployment profile
##
## https://hoangtuvungcao.github.io/vet-waf/
##
## This is the profile for an edge node that sits in front of the real
## application server and absorbs attack traffic on its behalf.
##
## INSTALL
##   cp etc/vet_waf.vps.conf /etc/vet_waf/vet_waf.conf
##   systemctl enable --now vet-waf
##
## It differs from the generic etc/vet_waf.conf in three ways:
##   - the backend points at the protected origin (85.117.239.3:80)
##   - the cache is ON, so spikes are absorbed at the edge
##   - health checks are ON, so a dead origin is detected in seconds
##
## See etc/vet_waf.conf for the fully commented explanation of every
## directive below.
##

# ============================================================================
# 1. LISTENERS
# ============================================================================
listen 80;

# Uncomment once a certificate exists on this host. Note that the certificate
# itself is declared INSIDE the `vhost` block near the bottom of this file,
# not here: this config uses a named vhost, and a named vhost serves its own
# certificate via SNI. A global certificate would only apply to the implicit
# default vhost and would never be presented for firewall.hidev.dev.
#listen 443 proto=h2,https;

# ============================================================================
# 2. WHAT TO DO WITH BAD TRAFFIC
# ============================================================================
# Drop confirmed attacks silently; answer honest client errors.
block_action attack drop;
block_action error  reply;

# ============================================================================
# 3. FRANG — anti-DDoS / WAF limits (per client IP)
# ============================================================================
frang_limits {
    # Ban a violating IP for 10 minutes rather than throttling it forever.
    ip_block 600;

    # L7 request flood.
    request_rate               100;
    request_burst               30;

    # Connection flood / socket exhaustion.
    tcp_connection_rate         50;
    tcp_connection_burst        20;
    concurrent_tcp_connections 100;

    # TLS handshake flood, including never-completed handshakes.
    tls_connection_rate             50;
    tls_connection_burst            20;
    tls_incomplete_connection_rate  30;

    # Slowloris: bound how long a request may take to arrive, and how finely
    # it may be dribbled across network chunks.
    client_header_timeout     10;
    client_body_timeout       30;
    http_header_chunk_cnt     10;
    http_body_chunk_cnt      256;

    # Malformed / oversized headers, HTTP/1 and HTTP/2 alike.
    http_header_cnt             50;
    http_hdr_len              4096;
    http_uri_len              2048;

    # Payload flooding. Raise only to your largest legitimate upload.
    http_body_len         16777216;

    # Request well-formedness: kills host confusion, cache poisoning,
    # and request smuggling.
    http_strict_host_checking    true;
    http_methods                 get head post;
    http_method_override_allowed false;
    http_trailer_split_allowed   false;

    # Eject vulnerability scanners: 25 error responses in 15s is enumeration.
    http_resp_code_block 400 403 404 405 413 429 500 25 15;
}

keepalive_timeout 30;

# ============================================================================
# 4. CACHE — shield the origin from spikes
# ============================================================================
# Enabled on the edge: a cache hit is served from kernel RAM and never
# reaches the origin, which is what lets one VPS absorb a large flood.
cache 2;
cache_fulfill * *;
cache_methods GET HEAD;
cache_ttl 3600;

# ============================================================================
# 5. BACKEND — the protected origin
# ============================================================================
#
# NOTE: the `health_check` block is defined BEFORE the `srv_group` that uses
# it. Vet-WAF does not validate health-monitor names at parse time, so a name
# that matches no block is a fatal error at startup — keep them in this order
# and keep the two names identical.
#
health_check origin_hc {
    request     "GET / HTTP/1.1\r\nHost: localhost\r\n\r\n";
    request_url "/";
    resp_code   200;
    timeout     5;
}

srv_group primary {
    # 64 pooled, persistent connections to the origin. Pooling matters under
    # attack: Vet-WAF absorbs the connection churn so the origin sees a
    # steady, small set of long-lived connections instead of a storm.
    server 85.117.239.3:80 conns_n=64;

    sched ratio static;

    # Bounded queue — sheds load rather than exhausting memory if the origin
    # slows down under pressure.
    server_queue_size 1000;

    # Failover: give up after 60s and retry up to 5 times. Add more `server`
    # lines above to fail over to a standby origin automatically.
    server_forward_timeout 60;
    server_forward_retries  5;

    # Reconnect attempts before the origin is declared dead.
    server_connect_retries 10;

    # Active health checking: poll the origin and pull it out of rotation the
    # moment it stops answering correctly, instead of waiting for user
    # requests to fail. Requires the `health_check` definition below.
    health origin_hc;
}

# ============================================================================
# 6. VIRTUAL HOST + ROUTING
# ============================================================================
#
# Public domain served by this edge node: firewall.hidev.dev
#
# DNS: point an A record at this VPS, NOT at the origin —
#   firewall.hidev.dev.  A  185.113.223.17
# The origin (85.117.239.3) must never appear in public DNS, or attackers
# will simply bypass the WAF and hit it directly.
#
vhost firewall.hidev.dev {
    # HTTPS (uncomment once a certificate exists, and enable the 443
    # listener above):
    #tls_certificate     /etc/vet_waf/tls/firewall.hidev.dev.crt;
    #tls_certificate_key /etc/vet_waf/tls/firewall.hidev.dev.key;

    proxy_pass primary;

    # Preserve the public hostname for the origin application.
    req_hdr_set Host firewall.hidev.dev;

    # Do not advertise backend software to attackers.
    resp_hdr_set Server "Vet-WAF";
}

# Routing table, evaluated top to bottom; first match wins.
http_chain {
    # Block known scanners and bad bots before anything else.
    #!include /etc/vet_waf/ua_block_rules.conf

    # Serve the public domain (and any subdomain of it).
    host == "firewall.hidev.dev"  -> firewall.hidev.dev;
    host == "*.hidev.dev"         -> firewall.hidev.dev;

    # Anything addressed to a hostname we do not serve is hostile or
    # misdirected — typically a scanner hitting the bare IP. Drop it.
    -> block;
}
