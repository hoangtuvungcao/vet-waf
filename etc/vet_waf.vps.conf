##
## Vet-WAF — VPS deployment profile
##
## Edge reverse-proxy on this VPS, protecting the real backend behind it.
## Derived from etc/vet_waf.conf with the backend pointed at the origin and
## the Frang limits kept strict. Install as /etc/vet_waf/vet_waf.conf on the
## edge host, then: systemctl enable --now vet-waf
##
## Full reference: https://github.com/hoangtuvungcao/vet-waf/wiki/Configuration
##

# --- Listener --------------------------------------------------------------
listen 80;

# TLS (uncomment once you have a certificate on this host):
#listen 443 proto=h2,https;
#tls_certificate     /etc/vet_waf/tls/server.crt;
#tls_certificate_key /etc/vet_waf/tls/server.key;

# --- Block actions ---------------------------------------------------------
block_action attack drop;
block_action error  reply;

# --- Anti-DDoS / WAF limits (Frang, per client) ----------------------------
# https://github.com/hoangtuvungcao/vet-waf/wiki/HTTP-security
frang_limits {
    request_rate               100;
    request_burst               30;
    tcp_connection_rate         50;
    tcp_connection_burst        20;
    concurrent_tcp_connections 100;
    http_methods               get head post;
    http_header_cnt             50;
    http_hdr_len              4096;
    http_uri_len              2048;
    http_body_len         16777216;
    http_strict_host_checking true;
}

keepalive_timeout 30;

# --- Cache (shield the origin from spikes) ---------------------------------
cache 2;
cache_fulfill * *;
cache_methods GET HEAD;
cache_ttl 3600;

# --- Backend (the protected origin) ----------------------------------------
# This edge node proxies to the application server on port 80.
srv_group primary {
    server 85.117.239.3:80 conns_n=64;
}

# --- Virtual host + routing ------------------------------------------------
vhost default {
    proxy_pass primary;
}

http_chain {
    #!include /etc/vet_waf/ua_block_rules.conf
    -> default;
}
