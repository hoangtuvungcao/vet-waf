##
## Vet-WAF — PRODUCTION edge profile for firewall.hidev.dev
##
## https://hoangtuvungcao.github.io/vet-waf/
##
## Role: kernel-space TLS-terminating reverse proxy + anti-DDoS WAF in front of
## the protected origin. Fronted by Cloudflare (Full mode): Cloudflare serves
## the public edge certificate and connects to this node over :443 with
## SNI=firewall.hidev.dev, so the origin certificate below need only be valid
## for that name (self-signed is accepted in Full mode and is what mango served
## before this migration — no client-visible regression).
##
##   Public:  client -> Cloudflare -> :443 (this node, Vet-WAF) -> origin
##   Origin:  http://103.77.246.164/   (never published in DNS)
##
## INSTALL (handled by scripts/cluster/vetwaf-migrate.sh):
##   cp etc/vet_waf.prod.conf /etc/vet_waf/vet_waf.conf
##   cp etc/ua_block_rules.conf /etc/vet_waf/ua_block_rules.conf
##   openssl ... -> /etc/vet_waf/tls/firewall.hidev.dev.{crt,key}
##   systemctl enable --now vet-waf
##

# ============================================================================
# 1. LISTENERS
# ============================================================================
# Plain HTTP. Every request here is force-redirected to HTTPS (see http_chain:
# nftables marks inbound :80 packets with fwmark 80, and the redirect rule
# matches that mark). In Cloudflare Full mode there is no legitimate plaintext
# traffic to the origin; :80 exists only to bounce stray direct hits to :443.
listen 80;

# HTTPS + HTTP/2. TLS is terminated in kernel space (the fast path). The
# certificate is declared INSIDE the named vhost below and presented via SNI.
listen 443 proto=h2,https;

# ============================================================================
# 2. WHAT TO DO WITH BAD TRAFFIC
# ============================================================================
# Drop confirmed attacks silently (costs the attacker a timeout, denies them
# tuning feedback); answer honest client errors politely.
block_action attack drop;
block_action error  reply;

# ============================================================================
# 3. FRANG — anti-DDoS / WAF limits, enforced per client IP in kernel space
# ============================================================================
# NOTE ON CLOUDFLARE: while firewall.hidev.dev is Cloudflare-proxied (orange
# cloud), these per-IP limits key on Cloudflare EDGE IPs, each of which
# aggregates many real visitors. The values below are tuned for the current
# DNS-only / direct-client topology. If the domain is moved behind Cloudflare
# proxying, RAISE request_rate/burst, the tcp/tls connection limits, and
# concurrent_tcp_connections substantially (or they will throttle Cloudflare).
frang_limits {
    # Ban a violating IP for 10 minutes rather than throttling it forever.
    ip_block 600;

    # L7 request flood. Sized so a heavy first page load (many assets over
    # HTTP/2) fits inside the burst window, while sustained floods are cut.
    request_rate               200;
    request_burst              100;

    # Connection flood / socket exhaustion.
    tcp_connection_rate         60;
    tcp_connection_burst        30;
    concurrent_tcp_connections 128;

    # TLS handshake flood, including never-completed handshakes (a cheap way
    # to exhaust a TLS-terminating proxy).
    tls_connection_rate             60;
    tls_connection_burst            30;
    tls_incomplete_connection_rate  30;

    # Slowloris: bound how long a request may take to arrive and how finely it
    # may be dribbled across network chunks. The timeouts are the primary
    # slow-attack control; the chunk counts are a secondary guard sized not to
    # trip a legitimate large upload on a GRO-enabled NIC.
    client_header_timeout     10;
    client_body_timeout       30;
    http_header_chunk_cnt     10;
    http_body_chunk_cnt     1024;

    # Malformed / oversized headers (HTTP/1 and HTTP/2 / HPACK alike). Header
    # length is generous enough for Cloudflare's added headers plus large
    # session/JWT cookies, but still bounded against header-bomb attacks.
    http_header_cnt             50;
    http_hdr_len              8192;
    http_uri_len              4096;

    # Payload flooding. Raise only to your largest legitimate upload.
    http_body_len         16777216;

    # Request well-formedness: kills host confusion, cache poisoning and
    # request smuggling. Strict host checking requires the Host/authority to
    # match and be present.
    http_strict_host_checking    true;

    # Allowed methods. Restricted to the RESTful set the origin application
    # needs (login POST, API verbs, CORS pre-flight OPTIONS); TRACE/CONNECT and
    # exotic WebDAV verbs are rejected. Method override is denied.
    http_methods get head post put delete patch options;
    http_method_override_allowed false;
    http_trailer_split_allowed   false;

    # Eject vulnerability scanners: 25 error responses in 15s is enumeration,
    # not a real user. (Also keys per-IP — see the Cloudflare note above.)
    http_resp_code_block 400 403 404 405 413 429 500 25 15;
}

keepalive_timeout 30;

# ============================================================================
# 4. CACHE — DISABLED
# ============================================================================
# The origin is a dynamic, session-bearing PHP application that returns
# "Cache-Control: no-store, no-cache" and sets PHPSESSID. Edge-caching it would
# corrupt sessions and serve stale authenticated content. Static assets are
# cached at the Cloudflare edge in front of us, so origin-side caching buys
# nothing here. 0 disables the cache.
cache 0;

# ============================================================================
# 5. BACKEND — the protected origin
# ============================================================================
#
# NOTE: the `health_check` block is defined BEFORE the `srv_group` that uses
# it. Vet-WAF does not validate health-monitor names at parse time, so a name
# that matches no block is a fatal startup error — keep this order and keep the
# two names identical.
#
health_check origin_hc {
    request     "GET / HTTP/1.1\r\nHost: firewall.hidev.dev\r\n\r\n";
    request_url "/";
    resp_code   200;
    timeout     5;
}

srv_group primary {
    # 64 pooled, persistent connections to the origin. Under attack Vet-WAF
    # absorbs the connection churn so the origin sees a small, steady set of
    # long-lived connections instead of a storm.
    server 103.77.246.164:80 conns_n=64;

    sched ratio static;

    # Bounded queue — sheds load rather than exhausting memory if the origin
    # slows under pressure.
    server_queue_size 1000;

    # Failover: give up after 60s, retry up to 5 times. Add more `server`
    # lines to fail over to a standby origin automatically.
    server_forward_timeout 60;
    server_forward_retries  5;

    # Reconnect attempts before the origin is declared dead.
    server_connect_retries 10;

    # Active health checking: pull a dead origin out of rotation in seconds
    # instead of waiting for user requests to fail.
    health origin_hc;
}

# ============================================================================
# 6. VIRTUAL HOST + ROUTING
# ============================================================================
#
# Public domain served by this edge node: firewall.hidev.dev
# DNS points at the edge nodes, never at the origin (103.77.246.164), or
# attackers would bypass the WAF and hit the origin directly.
#
vhost firewall.hidev.dev {
    # Self-signed certificate for firewall.hidev.dev, presented via SNI.
    # Accepted by Cloudflare in Full mode; matches the CN mango served before.
    tls_certificate     /etc/vet_waf/tls/firewall.hidev.dev.crt;
    tls_certificate_key /etc/vet_waf/tls/firewall.hidev.dev.key;

    proxy_pass primary;

    # Preserve the public hostname for the origin application, and tell it the
    # original request arrived over HTTPS so it builds correct absolute URLs.
    req_hdr_set Host              firewall.hidev.dev;
    req_hdr_set X-Forwarded-Proto https;

    # Do not advertise backend software (Apache/PHP versions) to attackers.
    resp_hdr_set Server "Vet-WAF";
}

# Routing table, evaluated top to bottom; first match wins. Mark-based rules
# (the :80 redirect) are evaluated before hostname rules by the engine.
http_chain {
    # Supplementary scanner / bad-bot signatures (User-Agent regex) are
    # DISABLED here. The `~` regex operator makes Vet-WAF compile a Hyperscan
    # database at startup via the external `hscollider` tool, which is not
    # installed on this node (and is a heavy source build). The directive's
    # scanner defense — `http_resp_code_block` in frang_limits above — is
    # enforced in kernel space and needs no external tooling, so it stays fully
    # active and bans IPs that enumerate the site. To add signature blocking
    # later, install hscollider (Hyperscan tools) or push the rules to the
    # Cloudflare WAF, then uncomment the include below.
    # !include /etc/vet_waf/ua_block_rules.conf

    # Force HTTPS: inbound :80 packets are tagged fwmark 80 by nftables; that
    # mark never appears on :443, so this cannot loop. If the mark is somehow
    # absent, the request simply falls through to the host rules and is served
    # rather than looping or being blocked. The '=' before the URL is required
    # grammar: a rule action's value is introduced by '=' (like `-> mark = 7`).
    mark == 80 -> 301 = "https://$host$request_uri";

    # Serve the public domain (and any subdomain of it).
    host == "firewall.hidev.dev"  -> firewall.hidev.dev;
    host == "*.hidev.dev"         -> firewall.hidev.dev;

    # Anything addressed to a hostname we do not serve is hostile or
    # misdirected — typically a scanner hitting the bare IP. Drop it.
    -> block;
}
