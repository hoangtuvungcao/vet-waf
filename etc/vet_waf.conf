##
## Vet-WAF — secure-by-default reverse proxy configuration
##
## https://hoangtuvungcao.github.io/vet-waf/
##
## HOW TO USE THIS FILE
##   1. Change the `server` line in the `srv_group primary` block at the bottom
##      to point at your own application.
##   2. Everything else is safe to leave alone — the defaults below are tuned
##      to stop L7 DDoS, slowloris, and malformed-request attacks out of the box.
##   3. Reload with:  systemctl reload vet-waf
##
## SYNTAX PRIMER (for newcomers)
##   - One directive per line, always terminated by a semicolon `;`.
##   - `#` starts a comment.
##   - Braces `{ }` group directives into a section.
##   - Sizes are in bytes, durations in seconds, unless stated otherwise.
##
## Every limit below is enforced PER CLIENT IP, not globally, so a single
## attacker cannot consume the budget that belongs to your real users.
##

# ============================================================================
# 1. LISTENERS — where Vet-WAF accepts traffic
# ============================================================================

# Plain HTTP.
listen 80;

# HTTPS + HTTP/2. Uncomment all three lines once you have a certificate.
# Vet-WAF terminates TLS in kernel space, so this is the fast path, not a
# slow one — prefer it in production.
#listen 443 proto=h2,https;
#tls_certificate     /etc/vet_waf/tls/server.crt;
#tls_certificate_key /etc/vet_waf/tls/server.key;

# ============================================================================
# 2. WHAT TO DO WITH BAD TRAFFIC
# ============================================================================

# `attack` = a confirmed attack. Drop silently: no reply packet is sent, which
#   costs the attacker a timeout and costs you nothing. Silence also denies
#   them the feedback they need to tune their tooling.
# `error`  = an ordinary client mistake (malformed request, unsupported
#   method). Reply politely so that real, buggy clients can see what happened.
block_action attack drop;
block_action error  reply;

# ============================================================================
# 3. FRANG — the anti-DDoS / WAF rule engine
# ============================================================================
#
# Frang is Vet-WAF's per-client enforcement engine. Each directive below is a
# separate, independent defence; together they close off the standard L7
# attack repertoire. Tighten anything your traffic does not need.
#
frang_limits {

    # --- Automatic IP blocking ---------------------------------------------
    # When a client trips ANY limit in this section, ban its IP outright for
    # this many seconds instead of merely rejecting the one request. This is
    # what converts a rate limit into an actual mitigation: a flooder is
    # ejected after its first violation rather than being throttled forever.
    # Set to a low value if you serve users behind large shared NATs.
    ip_block 600;

    # --- Request flood (L7 volumetric) -------------------------------------
    # `request_rate`  = sustained requests/second allowed per client.
    # `request_burst` = ceiling within a single 1/8-second sub-interval, which
    #   catches short spikes that a per-second average would smooth over.
    # Tune to your real traffic: a normal browser loading a page with assets
    # produces a burst of a few dozen, then goes quiet.
    request_rate               100;
    request_burst               30;

    # --- Connection flood --------------------------------------------------
    # Caps how fast a client may open TCP connections, and how many it may
    # hold open at once. `concurrent_tcp_connections` is the direct defence
    # against socket-exhaustion attacks.
    tcp_connection_rate         50;
    tcp_connection_burst        20;
    concurrent_tcp_connections 100;

    # --- TLS handshake flood -----------------------------------------------
    # A TLS handshake costs the server far more CPU than it costs the client,
    # which makes handshake floods cheap to mount and expensive to absorb.
    # `tls_incomplete_connection_rate` targets the common variant where the
    # attacker starts handshakes and never finishes them.
    tls_connection_rate             50;
    tls_connection_burst            20;
    tls_incomplete_connection_rate  30;

    # --- Slowloris ---------------------------------------------------------
    # Slowloris keeps thousands of connections alive by trickling a request a
    # few bytes at a time, exhausting your connection table without ever
    # generating load that a rate limit would notice.
    #
    # Two complementary defences:
    #   *_timeout   — a whole request head/body must ARRIVE within N seconds.
    #   *_chunk_cnt — the head/body may not be split across more than N network
    #                 chunks, which catches the byte-at-a-time drip directly.
    # Raise the body values if you accept large uploads over slow links.
    client_header_timeout     10;
    client_body_timeout       30;
    http_header_chunk_cnt     10;
    http_body_chunk_cnt      256;

    # --- Malformed / oversized headers (HTTP/1 and HTTP/2) -----------------
    # Bounds every structural part of a request. Oversized header attacks and
    # HTTP/2 HPACK bombs both die here, and these caps also protect the
    # parser itself from pathological input.
    http_header_cnt             50;    # max number of header fields
    http_hdr_len              4096;    # max length of any single header
    http_uri_len              2048;    # max request-URI length

    # --- Payload flooding --------------------------------------------------
    # Max request body. 16 MB suits a typical site; raise ONLY as far as your
    # largest legitimate upload, since every byte here is memory an attacker
    # can make you hold. Set to 1048576 (1 MB) for an API that takes only JSON.
    http_body_len         16777216;

    # --- Request well-formedness -------------------------------------------
    # Reject requests whose Host header is absent, duplicated, or disagrees
    # with the authority in the request line / :authority pseudo-header.
    # Closes off cache poisoning, host confusion, and request smuggling.
    http_strict_host_checking true;

    # Only permit the methods a normal website needs. Add `put delete options`
    # only if you knowingly serve a REST API that uses them.
    http_methods              get head post;

    # Refuse to honour X-HTTP-Method-Override and friends. Leaving this off
    # stops attackers from smuggling a DELETE past a filter that sees a POST.
    http_method_override_allowed false;

    # Reject trailers split across continuation frames — a smuggling vector
    # with no legitimate use.
    http_trailer_split_allowed false;

    # --- Vulnerability scanners --------------------------------------------
    # If a client racks up 25 4xx/5xx responses within a 15-second window, it
    # is enumerating your site rather than browsing it. This is the single
    # most effective rule against automated scanners and brute-force probing.
    # Syntax: http_resp_code_block <code>... <limit> <time-frame-seconds>;
    http_resp_code_block 400 403 404 405 413 429 500 25 15;
}

# --- URI byte allow-list ----------------------------------------------------
# Optional hard restriction on which bytes may appear in a request URI:
#   $ % & ( ) + , / 0-9 : ? - . = [ ] _ A-Z a-z
# Anything else is rejected before parsing. This blocks entire injection
# families at the door, but WILL break sites using non-ASCII or unusual URLs —
# test before enabling in production.
#http_uri_brange 0x24-0x26 0x28-0x29 0x2b 0x2c 0x2f 0x30-0x39 0x3a 0x3f
#                0x41-0x5a 0x5b 0x5d 0x5f 0x61-0x7a 0x2d 0x2e 0x3d;

# Reclaim idle keep-alive connections quickly. Under a connection-exhaustion
# attack, a shorter timeout is what keeps slots available for real users.
keepalive_timeout 30;

# ============================================================================
# 4. CACHE — absorb traffic spikes before they reach your app
# ============================================================================
#
# The cache is also a DDoS defence: a cached response is served from RAM in
# kernel space and never touches your backend. Uncomment to enable.
#
#cache 2;                  # 2 = normal sharded cache (0 disables)
#cache_fulfill * *;        # cache every cacheable response
#cache_methods GET HEAD;
#cache_ttl 3600;           # seconds

# ============================================================================
# 5. ACCESS LOG (optional)
# ============================================================================
# Structured access logging to ClickHouse for analytics and APM.
#access_log mmap logger_config=/etc/vet_waf/tfw_logger.json;

# ============================================================================
# 6. BACKEND — YOUR APPLICATION  ⟵ EDIT THIS
# ============================================================================
#
# Replace the `server` line with your own origin. Examples:
#   server 127.0.0.1:8080;             local app on the same host
#   server 10.0.0.5:80 conns_n=64;     LAN backend, 64 pooled connections
#   server https://example.com;        remote origin, proxied over TLS
#
# For failover, list several servers: Vet-WAF load-balances across them and
# takes any that stops responding out of rotation automatically.
#
srv_group primary {
    server https://example.com;

    # Round-robin by weight. Use `sched hash;` instead when your app needs a
    # given client to keep landing on the same backend.
    sched ratio static;

    # How many requests may queue for a backend before Vet-WAF sheds load.
    # A bounded queue is what stops a slow backend from turning into an
    # out-of-memory event on the proxy.
    server_queue_size 1000;

    # Give up on a backend request after 60s; retry another server up to 5x.
    server_forward_timeout 60;
    server_forward_retries  5;
}

# ============================================================================
# 7. VIRTUAL HOST + ROUTING
# ============================================================================

vhost default {
    proxy_pass primary;

    # Tell your backend the original request was HTTPS (uncomment when you
    # terminate TLS at Vet-WAF, so the app builds correct absolute URLs).
    #req_hdr_set X-Forwarded-Proto https;

    # Never leak backend software versions to attackers — fingerprinting is
    # step one of targeting a known CVE.
    resp_hdr_set Server "Vet-WAF";
    #resp_hdr_set X-Powered-By;
}

# Routing table, evaluated top to bottom; the first match wins.
# The bundled rule set blocks known bot and scanner User-Agents. It must come
# BEFORE the `-> default` catch-all, or it will never be reached.
http_chain {
    #!include /etc/vet_waf/ua_block_rules.conf
    -> default;
}
