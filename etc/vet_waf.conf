##
## Vet-WAF — simple, secure-by-default configuration
##
## This is a minimal starting point for a reverse proxy that protects a single
## backend. It is safe to run as-is: the Frang limits below give you L3–L7
## anti-DDoS out of the box. Change only the backend line to get started.
##
## Full reference: https://github.com/hoangtuvungcao/vet-waf/wiki/Configuration
##

# --- Listener --------------------------------------------------------------
# Plain HTTP on port 80. For TLS, uncomment the block below and point it at
# your certificate + key.
listen 80;

# TLS (HTTP/2 + HTTPS). See:
# https://github.com/hoangtuvungcao/vet-waf/wiki/Handling-clients
#listen 443 proto=h2,https;
#tls_certificate     /etc/vet_waf/tls/server.crt;
#tls_certificate_key /etc/vet_waf/tls/server.key;

# --- Block actions ---------------------------------------------------------
# Drop attackers silently (no response — cheapest for you, opaque for them).
# Reply with an error for ordinary client mistakes (malformed requests, etc).
# https://github.com/hoangtuvungcao/vet-waf/wiki/Handling-clients
block_action attack drop;
block_action error  reply;

# --- Anti-DDoS / WAF limits (Frang, enforced PER CLIENT) -------------------
# Secure-by-default. These stop request floods, connection floods, and
# slow-loris attacks before they reach your backend. Start strict; relax only
# what your real traffic needs.
# https://github.com/hoangtuvungcao/vet-waf/wiki/HTTP-security
frang_limits {
    # Request-rate caps (requests per second, per client IP).
    request_rate               100;
    request_burst               30;

    # TCP connection caps (per client IP).
    tcp_connection_rate         50;
    tcp_connection_burst        20;
    concurrent_tcp_connections 100;

    # Only allow the methods a normal site needs. Add PUT/DELETE only for APIs.
    http_methods               get head post;

    # Structural request validation — shrink the attack surface.
    http_header_cnt             50;    # max header fields
    http_hdr_len              4096;    # max single header length (bytes)
    http_uri_len              2048;    # max request-URI length (bytes)
    http_body_len         16777216;    # max body: 16 MB (raise for uploads)

    # Reject requests whose Host header is missing/forged or disagrees with the
    # authority in the request line. Kills a whole class of cache-poisoning and
    # host-confusion attacks.
    http_strict_host_checking true;
}

# Restrict the URI byte-range to a safe allow-list (uncomment to enable):
#   $ % ( ) + , / 0-9 : ? - . [ ] _ = A-Z a-z
# https://github.com/hoangtuvungcao/vet-waf/wiki/HTTP-security
#http_uri_brange 0x24-0x26 0x28-0x29 0x2b 0x2c 0x2f 0x30-0x39 0x3a 0x3f
#                0x41-0x5a 0x5b 0x5d 0x5f 0x61-0x7a 0x2d 0x2e 0x3d;

# Close idle keep-alive connections quickly to reclaim resources under load.
keepalive_timeout 30;

# --- Cache (optional) ------------------------------------------------------
# Serve GET/HEAD responses from a RAM cache to shield the backend from spikes.
# https://github.com/hoangtuvungcao/vet-waf/wiki/Caching-Responses
#cache 2;
#cache_fulfill * *;
#cache_methods GET HEAD;
#cache_ttl 3600;

# --- Access log (optional) -------------------------------------------------
# Structured access logging to ClickHouse for analytics / APM.
# https://github.com/hoangtuvungcao/vet-waf/wiki/Access-Log-Analytics
#access_log mmap logger_config=/etc/vet_waf/tfw_logger.json;

# --- Backend ---------------------------------------------------------------
# Replace https://example.com with YOUR origin. Examples:
#   server 127.0.0.1:8080;              (local app)
#   server 10.0.0.5:80 conns_n=64;      (LAN backend, 64 pooled connections)
#   server https://example.com;         (remote origin over TLS)
# https://github.com/hoangtuvungcao/vet-waf/wiki/Backend-servers
srv_group primary {
    server https://example.com;
}

# --- Virtual host + routing ------------------------------------------------
# https://github.com/hoangtuvungcao/vet-waf/wiki/Virtual-hosts-and-locations
vhost default {
    # Common forwarding headers (uncomment as needed):
    #req_hdr_set X-Forwarded-Proto https;

    proxy_pass primary;
}

# Request routing. To add signature-based bot/scanner blocking, uncomment the
# include below (ships with Vet-WAF). It must come BEFORE the default rule.
# https://github.com/hoangtuvungcao/vet-waf/wiki/HTTP-tables
http_chain {
    #!include /etc/vet_waf/ua_block_rules.conf
    -> default;
}
